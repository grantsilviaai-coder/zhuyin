<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注音小學堂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 版面概念：像學校的作業簿，田字格寫國字、旁邊標注音；紅筆訂正、綠筆打勾 */
:root{
  --paper:#eef4ef;
  --card:#ffffff;
  --ink:#1c3553;
  --muted:#5d7084;
  --grid:#c4d8cb;
  --accent:#1f62b0;
  --accent-soft:#dde9f7;
  --star:#f0a91e;
  --good:#23885a;
  --good-soft:#dcf1e5;
  --bad:#d23f3f;
  --bad-soft:#fbe3e3;
  --font-display:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  background-position:-1px -1px;
  color:var(--ink);
  font-family:var(--font-body);
  font-size:18px;
  line-height:1.6;
  min-height:100vh;
}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0}
.brand-mark{width:52px;height:52px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--font-body);font-weight:900;font-size:28px}
.brand h1{margin:0;font-family:var(--font-display);font-size:32px;line-height:1.1;text-align:left}
.brand small{display:block;font-size:14px;color:var(--muted);font-family:var(--font-body)}
.stars{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:6px 16px;font-weight:700;font-variant-numeric:tabular-nums}
.stars svg{width:24px;height:24px}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:24px;box-shadow:4px 4px 0 var(--ink)}
h2{font-family:var(--font-display);font-size:26px;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 20px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:16px;transition:transform .12s}
.mode:hover{transform:translateY(-2px);background:var(--accent-soft)}
.mode .tag{font-size:13px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:1px 8px;align-self:flex-start}
.mode b{font-size:21px;font-family:var(--font-display)}
.mode .ex{font-size:15px;color:var(--muted)}
.mode.review .tag{background:var(--bad)}
.mode.parent .tag{background:var(--good)}
.mode.mix .tag{background:var(--star);color:var(--ink)}
.mode[disabled]{opacity:.5;cursor:not-allowed;transform:none;background:var(--card)}
.section-gap{display:flex;flex-direction:column;gap:18px}

/* 作答畫面 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ghost{background:none;border:2px solid var(--ink);border-radius:10px;padding:6px 14px;font-size:16px;font-weight:500}
.ghost:hover{background:var(--accent-soft)}
.progress{flex:1;min-width:160px;display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-weight:700}
.bar{flex:1;height:12px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}
.bar i{display:block;height:100%;background:var(--good);transition:width .3s}
.q-title{font-size:20px;font-weight:700;margin:0 0 16px;text-align:center}
.word{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 22px}
.cell{display:flex;align-items:center;gap:6px;background:var(--card)}
.ch{width:92px;height:92px;display:grid;place-items:center;font-family:var(--font-display);font-size:62px;line-height:1;border:2px solid var(--bad);position:relative;
  background-image:linear-gradient(90deg,transparent calc(50% - .5px),rgba(210,63,63,.35) calc(50% - .5px),rgba(210,63,63,.35) calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(transparent calc(50% - .5px),rgba(210,63,63,.35) calc(50% - .5px),rgba(210,63,63,.35) calc(50% + .5px),transparent calc(50% + .5px));}
.zy{writing-mode:vertical-rl;text-orientation:upright;font-family:var(--font-body);font-size:24px;font-weight:500;letter-spacing:-2px;min-height:92px;display:flex;align-items:center;justify-content:center;min-width:28px}
.zy-only .zy{font-size:34px;min-width:40px;min-height:120px}
.cell.target .ch{background-color:#fff6d8}
.cell.target .zy{color:var(--bad);font-weight:700}
.blank{color:var(--bad)}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.options.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.opt{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:14px 10px;font-size:24px;font-weight:500;min-height:72px;display:flex;align-items:center;justify-content:center;gap:4px;flex-direction:column;box-shadow:3px 3px 0 var(--ink);transition:transform .08s}
.opt:hover:not([disabled]){background:var(--accent-soft)}
.opt:active:not([disabled]){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt.word-opt{font-family:var(--font-display);font-size:34px}
.opt.big{font-size:44px}
.opt small{font-size:14px;color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good);box-shadow:3px 3px 0 var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);box-shadow:3px 3px 0 var(--bad);text-decoration:line-through;text-decoration-color:var(--bad)}
.feedback{margin-top:18px;border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.feedback.ok{background:var(--good-soft);border:2px solid var(--good)}
.feedback.no{background:var(--bad-soft);border:2px solid var(--bad)}
.feedback .msg{font-size:20px;font-weight:700}
.feedback .ans{font-size:18px}
.feedback .ans .w{font-family:var(--font-display);font-size:26px;margin-right:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:2px solid var(--ink);border-radius:12px;padding:10px 20px;font-size:18px;font-weight:700;background:var(--accent);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.light{background:var(--card);color:var(--ink)}
.btn svg{width:20px;height:20px;vertical-align:-4px;margin-right:4px}
.streak{text-align:center;font-weight:700;color:var(--star);min-height:28px;margin-top:10px}

/* 結果 */
.result{text-align:center}
.big-score{font-family:var(--font-display);font-size:72px;line-height:1;margin:10px 0;font-variant-numeric:tabular-nums}
.star-row{display:flex;justify-content:center;gap:6px;margin:10px 0 18px}
.star-row svg{width:44px;height:44px}
.wrong-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 20px}
.chip{border:2px solid var(--bad);background:var(--bad-soft);border-radius:999px;padding:2px 12px;font-size:16px}
.chip .w{font-family:var(--font-display);font-size:20px;margin-right:6px}

/* 家長區 */
textarea{width:100%;min-height:140px;border:2px solid var(--ink);border-radius:12px;padding:12px;font-size:20px;font-family:var(--font-body);resize:vertical;background:#fff;color:var(--ink)}
.kb{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.kb button{width:42px;height:42px;border:2px solid var(--ink);border-radius:8px;background:#fff;font-size:20px;padding:0}
.kb button:hover{background:var(--accent-soft)}
.kb .wide{width:auto;padding:0 12px;font-size:15px}
.kb .tone{background:#fff6d8}
.hint{font-size:15px;color:var(--muted)}
.err{color:var(--bad);font-size:16px;white-space:pre-line}
.okmsg{color:var(--good);font-size:16px;font-weight:700}
.mylist{display:flex;flex-wrap:wrap;gap:8px}
.mychip{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:10px;padding:4px 6px 4px 12px;background:#fff}
.mychip .w{font-family:var(--font-display);font-size:22px}
.mychip .z{font-size:14px;color:var(--muted)}
.mychip button{border:0;background:var(--bad-soft);color:var(--bad);border-radius:6px;font-size:14px;padding:2px 8px}
.toggle{display:flex;align-items:center;gap:8px;font-size:17px}
.toggle input{width:22px;height:22px}
.foot{text-align:center;color:var(--muted);font-size:14px;margin-top:22px}
[hidden]{display:none !important}

@media (max-width:520px){
  .ch{width:72px;height:72px;font-size:48px}
  .zy{font-size:20px;min-height:72px}
  .options.five{grid-template-columns:repeat(3,minmax(0,1fr))}
  .panel{padding:18px}
  .brand h1{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="brand" id="homeBtn" aria-label="回首頁">
      <span class="brand-mark">ㄅ</span>
      <span><h1>注音小學堂</h1><small>三年級在家自己練習</small></span>
    </button>
    <div class="stars" title="累積的星星">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#f0a91e" stroke="#1c3553" stroke-width="1.5" d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>
      <span id="starCount">0</span> 顆星
    </div>
  </header>

  <!-- 首頁 -->
  <section id="home" class="section-gap">
    <div class="panel">
      <h2>今天想練什麼？</h2>
      <p class="lead">每一回 10 題，答對一題得一顆星。答錯的題目會記下來，之後可以再練一次。</p>
      <div class="modes">
        <button class="mode" data-mode="m1"><span class="tag">看字選注音</span><b>這個字怎麼拼？</b><span class="ex">看到「蝴蝶」，選出 ㄏㄨˊ ㄉㄧㄝˊ</span></button>
        <button class="mode" data-mode="m2"><span class="tag">看注音選字</span><b>這是哪個詞？</b><span class="ex">看到 ㄆㄧㄥˊ ㄍㄨㄛˇ，選出「蘋果」</span></button>
        <button class="mode" data-mode="m3"><span class="tag">聲調練習</span><b>第幾聲？</b><span class="ex">一聲、二聲、三聲、四聲，還是輕聲</span></button>
        <button class="mode" data-mode="m4"><span class="tag">易混淆音</span><b>ㄓ 還是 ㄗ？</b><span class="ex">ㄓㄗ、ㄔㄘ、ㄕㄙ、ㄣㄥ、ㄢㄤ、ㄋㄌ、ㄈㄏ</span></button>
        <button class="mode mix" data-mode="mix"><span class="tag">綜合挑戰</span><b>四種題型混在一起</b><span class="ex">考前複習最適合</span></button>
        <button class="mode review" data-mode="review" id="reviewCard"><span class="tag">錯題複習</span><b>再練一次</b><span class="ex" id="reviewInfo">目前沒有錯題</span></button>
      </div>
    </div>
    <div class="panel">
      <div class="modes">
        <button class="mode parent" id="parentBtn"><span class="tag">家長／老師區</span><b>加入課本生字詞</b><span class="ex" id="customInfo">把這週要考的詞加進來</span></button>
      </div>
    </div>
  </section>

  <!-- 作答 -->
  <section id="quiz" hidden>
    <div class="topbar">
      <button class="ghost" id="quitBtn">← 回首頁</button>
      <div class="progress"><span id="progText">第 1 / 10 題</span><div class="bar"><i id="progBar" style="width:0%"></i></div></div>
    </div>
    <div class="panel" id="qPanel">
      <p class="q-title" id="qTitle"></p>
      <div id="qWord"></div>
      <div id="qOptions"></div>
      <div id="qFeedback"></div>
      <div class="streak" id="streak" aria-live="polite"></div>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" hidden>
    <div class="panel result">
      <h2 id="rTitle">完成了！</h2>
      <div class="big-score" id="rScore">8 / 10</div>
      <div class="star-row" id="rStars"></div>
      <div id="rWrong"></div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="againBtn">再玩一回</button>
        <button class="btn light" id="rReviewBtn">練習錯題</button>
        <button class="btn light" id="rHomeBtn">回首頁</button>
      </div>
    </div>
  </section>

  <!-- 家長區 -->
  <section id="parent" hidden>
    <div class="topbar"><button class="ghost" id="parentBack">← 回首頁</button></div>
    <div class="panel section-gap">
      <div>
        <h2>加入自己的字詞</h2>
        <p class="lead" style="margin-bottom:8px">一行一個詞：先寫國字，空一格，再寫每個字的注音（每個字的注音之間也空一格）。輕聲的「˙」寫在最前面。</p>
        <p class="hint">例如：<br>蝴蝶 ㄏㄨˊ ㄉㄧㄝˊ<br>桌子 ㄓㄨㄛ ˙ㄗ</p>
      </div>
      <div>
        <label for="customInput" class="hint">可以用下面的注音鍵盤輸入，也可以直接打字或貼上</label>
        <textarea id="customInput" placeholder="蝴蝶 ㄏㄨˊ ㄉㄧㄝˊ"></textarea>
        <div class="kb" id="kb"></div>
        <div class="actions"><button class="btn" id="addBtn">加入題庫</button></div>
        <p class="err" id="addErr" aria-live="polite"></p>
        <p class="okmsg" id="addOk" aria-live="polite"></p>
      </div>
      <div>
        <h2 style="font-size:22px">我加的字詞（<span id="myCount">0</span>）</h2>
        <label class="toggle"><input type="checkbox" id="onlyMine"> 只練習我加的字詞</label>
        <p class="hint" style="margin:4px 0 10px">勾選後，所有題型都只會出這些詞（至少要有 4 個詞）。</p>
        <div class="mylist" id="myList"></div>
      </div>
    </div>
  </section>

  <p class="foot">進度只存在這台裝置的瀏覽器裡。朗讀功能使用瀏覽器內建語音。</p>
</div>

<script>
// ======== 內建題庫（三年級常見詞） ========
const RAW = `
蝴蝶 ㄏㄨˊ ㄉㄧㄝˊ
蘋果 ㄆㄧㄥˊ ㄍㄨㄛˇ
學校 ㄒㄩㄝˊ ㄒㄧㄠˋ
老師 ㄌㄠˇ ㄕ
同學 ㄊㄨㄥˊ ㄒㄩㄝˊ

// ======== 工具 ========
const TONE_MARK = {1:'',2:'ˊ',3:'ˇ',4:'ˋ'};
const MARK_TONE = {'ˊ':2,'ˇ':3,'ˋ':4,'ˉ':1};
const PAIRS = {'ㄓ':'ㄗ','ㄗ':'ㄓ','ㄔ':'ㄘ','ㄘ':'ㄔ','ㄕ':'ㄙ','ㄙ':'ㄕ','ㄣ':'ㄥ','ㄥ':'ㄣ','ㄢ':'ㄤ','ㄤ':'ㄢ','ㄋ':'ㄌ','ㄌ':'ㄋ','ㄈ':'ㄏ','ㄏ':'ㄈ'};
const TONE_NAMES = {1:'一聲',2:'二聲',3:'三聲',4:'四聲',5:'輕聲'};
const TONE_SHOW = {1:'ˉ',2:'ˊ',3:'ˇ',4:'ˋ',5:'˙'};
const ZY_RE = /^[ㄅ-ㄩ]+$/;

function parseSyl(s){
  s = s.trim();
  if(s[0]==='˙' || s[0]==='·') return {l:s.slice(1), t:5};
  const last = s[s.length-1];
  if(MARK_TONE[last]) return {l:s.slice(0,-1), t:MARK_TONE[last]};
  return {l:s, t:1};
}
function fmt(sy){ return sy.t===5 ? '˙'+sy.l : sy.l+TONE_MARK[sy.t]; }
function zyStr(syl){ return syl.map(fmt).join(' '); }
function parseLine(line){
  const parts = line.trim().split(/\s+/);
  if(parts.length<2) return {err:'少了注音'};
  const w = parts[0];
  const chars = Array.from(w);
  const syl = parts.slice(1).map(parseSyl);
  if(chars.some(c=>!/[一-鿿]/.test(c))) return {err:'第一段要是國字'};
  if(chars.length!==syl.length) return {err:`「${w}」有 ${chars.length} 個字，但注音有 ${syl.length} 組`};
  for(const s of syl){ if(!s.l || !ZY_RE.test(s.l)) return {err:`注音「${fmt(s)}」看不懂，請只用注音符號`}; }
  return {w, syl};
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const store = {
  get(k,d){ try{ const v=localStorage.getItem('zyx-'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('zyx-'+k, JSON.stringify(v)); }catch(e){} }
};

const BUILTIN = RAW.trim().split('\n').map(parseLine).filter(x=>x && !x.err);
let state = {
  stars: store.get('stars',0),
  wrong: store.get('wrong',[]),        // [{w, mode}]
  custom: store.get('custom',[]),      // ["蝴蝶 ㄏㄨˊ ㄉㄧㄝˊ"]
  onlyMine: store.get('onlyMine',false)
};
function customItems(){ return state.custom.map(parseLine).filter(x=>x && !x.err); }
function allItems(){
  const map = new Map();
  BUILTIN.forEach(i=>map.set(i.w,i));
  customItems().forEach(i=>map.set(i.w,i));
  return [...map.values()];
}
function pool(){
  const mine = customItems();
  if(state.onlyMine && mine.length>=4) return mine;
  return allItems();
}
function findItem(w){ return allItems().find(i=>i.w===w); }

// ======== 朗讀 ========
const canSpeak = 'speechSynthesis' in window;
function speak(text){
  if(!canSpeak) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-TW'; u.rate = 0.75;
    const v = speechSynthesis.getVoices().find(v=>/zh[-_]TW/i.test(v.lang)) || speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang));
    if(v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
if(canSpeak){ try{ speechSynthesis.getVoices(); }catch(e){} }

// ======== 出題 ========
function hasConfusable(item){ return item.syl.some(s=>[...s.l].some(c=>PAIRS[c])); }

function makeQ(mode, item, P){
  if(mode==='m1'){
    const correct = zyStr(item.syl);
    const tones=[], swaps=[];
    item.syl.forEach((s,i)=>{
      for(let t=1;t<=5;t++){ if(t!==s.t){ const c=item.syl.map(x=>({...x})); c[i].t=t; tones.push(zyStr(c)); } }
      [...s.l].forEach((ch,k)=>{ if(PAIRS[ch]){ const c=item.syl.map(x=>({...x})); const arr=[...s.l]; arr[k]=PAIRS[ch]; c[i].l=arr.join(''); swaps.push(zyStr(c)); } });
    });
    const set = new Set();
    shuffle(swaps).slice(0,2).forEach(x=>{ if(x!==correct) set.add(x); });
    for(const x of shuffle(tones)){ if(set.size>=3) break; if(x!==correct) set.add(x); }
    const opts = shuffle([correct, ...[...set].slice(0,3)]);
    return {mode,item,title:'這個詞的注音是哪一個？',show:'char',options:opts.map(o=>({label:esc(o),key:o,correct:o===correct})),cls:''};
  }
  if(mode==='m2'){
    const len = item.syl.length;
    let others = P.filter(i=>i.w!==item.w && i.syl.length===len);
    if(others.length<3) others = P.filter(i=>i.w!==item.w);
    const opts = shuffle([item, ...shuffle(others).slice(0,3)]);
    return {mode,item,title:'這是哪一個詞？',show:'zy',options:opts.map(o=>({label:esc(o.w),key:o.w,correct:o.w===item.w})),cls:'word-opt'};
  }
  if(mode==='m3'){
    const idx = Math.floor(Math.random()*item.syl.length);
    const ch = Array.from(item.w)[idx];
    const t = item.syl[idx].t;
    return {mode,item,idx,title:`「${ch}」是第幾聲？`,show:'tone',options:[1,2,3,4,5].map(n=>({label:`${TONE_SHOW[n]}<small>${TONE_NAMES[n]}</small>`,key:n,correct:n===t})),cls:'five'};
  }
  if(mode==='m4'){
    const spots=[];
    item.syl.forEach((s,i)=>[...s.l].forEach((c,k)=>{ if(PAIRS[c]) spots.push({i,k,c}); }));
    const sp = pick(spots);
    const pair = shuffle([sp.c, PAIRS[sp.c]]);
    return {mode,item,idx:sp.i,spot:sp,title:'空格裡應該填哪一個？',show:'blank',options:pair.map(p=>({label:p,key:p,correct:p===sp.c})),cls:'big'};
  }
}

function buildRound(mode){
  const P = pool();
  if(mode==='review'){
    const list = shuffle(state.wrong).slice(0,10).map(x=>{ const it=findItem(x.w); return it?{mode:x.mode,item:it}:null; }).filter(Boolean);
    return list.map(x=>{ let m=x.mode; if(m==='m4' && !hasConfusable(x.item)) m='m1'; return makeQ(m,x.item,P); });
  }
  const qs=[]; const used=new Set();
  for(let n=0;n<10;n++){
    let m = mode==='mix' ? pick(['m1','m2','m3','m4']) : mode;
    let cands = P.filter(i=>!used.has(i.w) && (m!=='m4'||hasConfusable(i)));
    if(!cands.length){ cands = P.filter(i=>m!=='m4'||hasConfusable(i)); }
    if(!cands.length){ m='m1'; cands=P; }
    const it = pick(cands); used.add(it.w);
    qs.push(makeQ(m,it,P));
  }
  return qs;
}

// ======== 畫面 ========
const $ = id=>document.getElementById(id);
const screens = ['home','quiz','result','parent'];
function show(name){ screens.forEach(s=>$(s).hidden = s!==name); window.scrollTo(0,0); if(name==='home') refreshHome(); }

function refreshHome(){
  $('starCount').textContent = state.stars;
  const n = state.wrong.length;
  $('reviewInfo').textContent = n ? `有 ${n} 題等你再挑戰` : '目前沒有錯題，太棒了';
  $('reviewCard').disabled = !n;
  const c = customItems().length;
  $('customInfo').textContent = c ? `已加入 ${c} 個詞${state.onlyMine&&c>=4?'（目前只練這些）':''}` : '把這週要考的詞加進來';
}

function wordHTML(q, revealed){
  const chars = Array.from(q.item.w);
  const zyOnly = q.show==='zy' && !revealed;
  const cells = chars.map((c,i)=>{
    const s = q.item.syl[i];
    let zy = fmt(s);
    let target = false;
    if(!revealed){
      if(q.show==='char') zy = '';
      if(q.show==='tone' && i===q.idx){ target=true; zy = s.l + '<span class="blank">？</span>'; }
      if(q.show==='blank' && i===q.idx){ target=true; const arr=[...s.l]; arr[q.spot.k]='<span class="blank">▢</span>'; zy = (s.t===5?'˙':'') + arr.join('') + (s.t===5?'':TONE_MARK[s.t]); }
    } else if((q.show==='tone'||q.show==='blank') && i===q.idx){ target=true; }
    const chHTML = zyOnly ? '' : `<span class="ch">${esc(c)}</span>`;
    const zyHTML = zy ? `<span class="zy">${zy}</span>` : '';
    return `<div class="cell${target?' target':''}">${chHTML}${zyHTML}</div>`;
  }).join('');
  return `<div class="word${zyOnly?' zy-only':''}">${cells}</div>`;
}

let round=[], qi=0, score=0, streak=0, roundWrong=[], lastMode='m1', answered=false;

function startRound(mode){
  if(pool().length<4){ alertBox('題庫至少要有 4 個詞'); return; }
  lastMode = mode;
  round = buildRound(mode);
  if(!round.length){ show('home'); return; }
  qi=0; score=0; streak=0; roundWrong=[];
  show('quiz'); renderQ();
}
function alertBox(msg){ $('reviewInfo').textContent = msg; }

const speakerSVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

function renderQ(){
  answered=false;
  const q = round[qi];
  $('progText').textContent = `第 ${qi+1} / ${round.length} 題`;
  $('progBar').style.width = (qi/round.length*100)+'%';
  $('qTitle').textContent = q.title;
  $('qWord').innerHTML = wordHTML(q,false);
  $('qOptions').className = 'options ' + (q.cls==='five'?'five':'');
  $('qOptions').innerHTML = q.options.map((o,i)=>`<button class="opt ${q.cls==='five'?'':q.cls}" data-i="${i}">${o.label}</button>`).join('');
  $('qFeedback').innerHTML = '';
  $('qOptions').querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.i)));
  $('qPanel').classList.remove('pop'); void $('qPanel').offsetWidth; $('qPanel').classList.add('pop');
}

function answer(i){
  if(answered) return; answered=true;
  const q = round[qi];
  const ok = q.options[i].correct;
  const btns = $('qOptions').querySelectorAll('.opt');
  btns.forEach((b,k)=>{ b.disabled=true; if(q.options[k].correct) b.classList.add('right'); });
  if(!ok) btns[i].classList.add('wrong');
  const key = {w:q.item.w, mode:q.mode};
  if(ok){
    score++; streak++; state.stars++;
    if(lastMode==='review'){ state.wrong = state.wrong.filter(x=>!(x.w===key.w && x.mode===key.mode)); }
  } else {
    streak=0; roundWrong.push(q);
    if(!state.wrong.some(x=>x.w===key.w && x.mode===key.mode)) state.wrong.push(key);
  }
  store.set('stars',state.stars); store.set('wrong',state.wrong);
  $('starCount').textContent = state.stars;
  $('streak').textContent = streak>=3 ? `連續答對 ${streak} 題！` : '';
  $('qWord').innerHTML = wordHTML(q,true);
  const praise = pick(['答對了！','好厲害！','完全正確！','你真棒！']);
  const last = qi===round.length-1;
  $('qFeedback').innerHTML = `<div class="feedback ${ok?'ok':'no'}">
    <div><div class="msg">${ok?praise:'沒關係，記住正確答案'}</div>
    <div class="ans"><span class="w">${esc(q.item.w)}</span>${esc(zyStr(q.item.syl))}</div></div>
    <div class="actions">
      ${canSpeak?`<button class="btn light" id="sayBtn">${speakerSVG}聽一聽</button>`:''}
      <button class="btn" id="nextBtn">${last?'看成績':'下一題 →'}</button>
    </div></div>`;
  if(canSpeak) $('sayBtn').addEventListener('click',()=>speak(q.item.w));
  $('nextBtn').addEventListener('click',next);
  $('nextBtn').focus();
}

function next(){
  qi++;
  if(qi>=round.length) return showResult();
  renderQ();
}

const starSVG = on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="${on?'#f0a91e':'#e3e8ec'}" stroke="#1c3553" stroke-width="1.5" d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>`;
function showResult(){
  show('result');
  const total = round.length;
  const ratio = score/total;
  const s3 = ratio>=0.9?3:ratio>=0.6?2:ratio>0?1:0;
  $('rTitle').textContent = ratio===1?'全部答對，太厲害了！':ratio>=0.8?'很棒！差一點就全對':ratio>=0.6?'不錯喔，繼續加油':'多練幾次就會越來越熟';
  $('rScore').textContent = `${score} / ${total}`;
  $('rStars').innerHTML = [0,1,2].map(i=>starSVG(i<s3)).join('');
  $('rWrong').innerHTML = roundWrong.length ? `<p class="hint">這回答錯的詞：</p><div class="wrong-list">${roundWrong.map(q=>`<span class="chip"><span class="w">${esc(q.item.w)}</span>${esc(zyStr(q.item.syl))}</span>`).join('')}</div>` : '';
  $('rReviewBtn').hidden = !state.wrong.length;
}

// ======== 家長區 ========
const KB_ROWS = ['ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ','ㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ'];
function buildKB(){
  const kb = $('kb');
  let html = KB_ROWS.join('').split('').map(c=>`<button type="button" data-k="${c}">${c}</button>`).join('');
  html += ['ˊ','ˇ','ˋ','˙'].map(c=>`<button type="button" class="tone" data-k="${c}" aria-label="聲調 ${c}">${c}</button>`).join('');
  html += `<button type="button" class="wide" data-k=" ">空格</button><button type="button" class="wide" data-k="\n">換行</button><button type="button" class="wide" data-k="⌫">刪除</button>`;
  kb.innerHTML = html;
  kb.addEventListener('click',e=>{
    const b = e.target.closest('button'); if(!b) return;
    const ta = $('customInput'); const k = b.dataset.k;
    const s = ta.selectionStart ?? ta.value.length, en = ta.selectionEnd ?? ta.value.length;
    if(k==='⌫'){
      if(s===en && s>0){ ta.value = ta.value.slice(0,s-1)+ta.value.slice(en); ta.selectionStart=ta.selectionEnd=s-1; }
      else { ta.value = ta.value.slice(0,s)+ta.value.slice(en); ta.selectionStart=ta.selectionEnd=s; }
    } else {
      ta.value = ta.value.slice(0,s)+k+ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s+k.length;
    }
    ta.focus();
  });
}
function renderMine(){
  const items = customItems();
  $('myCount').textContent = items.length;
  $('onlyMine').checked = state.onlyMine;
  $('myList').innerHTML = items.length ? items.map((it,i)=>`<span class="mychip"><span class="w">${esc(it.w)}</span><span class="z">${esc(zyStr(it.syl))}</span><button data-del="${esc(it.w)}" aria-label="刪除 ${esc(it.w)}">刪除</button></span>`).join('') : '<span class="hint">還沒有加入任何字詞</span>';
  $('myList').querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    state.custom = state.custom.filter(l=>{ const p=parseLine(l); return !(p && p.w===b.dataset.del); });
    store.set('custom',state.custom); renderMine();
  }));
}
$('addBtn').addEventListener('click',()=>{
  const lines = $('customInput').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const errs=[]; let added=0;
  lines.forEach((l,n)=>{
    const p = parseLine(l);
    if(p.err){ errs.push(`第 ${n+1} 行：${p.err}`); return; }
    const norm = p.w+' '+zyStr(p.syl);
    state.custom = state.custom.filter(x=>{ const q=parseLine(x); return !(q && q.w===p.w); });
    state.custom.push(norm); added++;
  });
  store.set('custom',state.custom);
  $('addErr').textContent = errs.join('\n');
  $('addOk').textContent = added ? `已加入 ${added} 個詞` : '';
  if(!errs.length) $('customInput').value='';
  renderMine();
});
$('onlyMine').addEventListener('change',e=>{ state.onlyMine=e.target.checked; store.set('onlyMine',state.onlyMine); });

// ======== 事件 ========
document.querySelectorAll('.mode[data-mode]').forEach(b=>b.addEventListener('click',()=>startRound(b.dataset.mode)));
$('homeBtn').addEventListener('click',()=>show('home'));
$('quitBtn').addEventListener('click',()=>show('home'));
$('rHomeBtn').addEventListener('click',()=>show('home'));
$('againBtn').addEventListener('click',()=>startRound(lastMode==='review'&&!state.wrong.length?'mix':lastMode));
$('rReviewBtn').addEventListener('click',()=>startRound('review'));
$('parentBtn').addEventListener('click',()=>{ show('parent'); renderMine(); });
$('parentBack').addEventListener('click',()=>show('home'));
buildKB();
refreshHome();
</script>
